<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c63ff">
<title>Meu Dinheiro 2.0</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fb;color:#222}
header{background:#6c63ff;color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}
main{max-width:650px;margin:auto;padding:15px 15px 90px}
.card{background:#fff;padding:16px;margin:12px 0;border-radius:18px;box-shadow:0 3px 15px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f7fb;padding:13px;border-radius:14px}
.metric span{font-size:12px;color:#666}.metric b{display:block;font-size:20px;margin-top:5px}
input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{background:#6c63ff;color:white;border:0;font-weight:bold;margin-top:9px}
label{font-size:13px;color:#666;display:block;margin:9px 0 5px}
.progress{height:16px;background:#e8e8ef;border-radius:20px;overflow:hidden}.bar{height:100%;background:#6c63ff;width:0}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.tabs{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px;box-shadow:0 -2px 12px #0001}
.tabs button{font-size:12px;margin:0;padding:10px}
</style></head>
<body>
<header><h1>💰 Meu Dinheiro 2.0</h1><div>Seu controle financeiro</div></header>
<main>
<section id="home">
<div class="card"><h2>Resumo da semana</h2><div class="grid">
<div class="metric"><span>Renda</span><b id="income"></b></div>
<div class="metric"><span>Livre</span><b id="free"></b></div>
<div class="metric"><span>Guardar</span><b id="saving"></b></div>
<div class="metric"><span>Guardado</span><b id="saved"></b></div></div></div>
<div class="card"><h2>🎯 Meta</h2><div class="progress"><div class="bar" id="bar"></div></div><p id="goalText"></p></div>
<div class="card"><h2>📊 Gastos</h2><div id="expensesList"></div></div>
</section>

<section id="add" style="display:none"><div class="card"><h2>➕ Adicionar gasto</h2>
<label>Valor (€)</label><input id="amount" type="number" step="0.01">
<label>Descrição</label><input id="description" placeholder="Ex.: Tesco">
<label>Categoria</label><select id="category"><option>Mercado</option><option>Gasolina</option><option>Casa</option><option>Cartão</option><option>Babá</option><option>Outros</option></select>
<button onclick="addExpense()">Adicionar gasto</button><div id="history"></div></div></section>

<section id="settings" style="display:none"><div class="card"><h2>⚙️ Editar valores</h2>
<div id="form"></div><button onclick="save()">Salvar alterações</button></div></section>

<section id="goals" style="display:none"><div class="card"><h2>🎯 Minha meta</h2>
<label>Meta (€)</label><input id="goalInput" type="number">
<label>Já guardado (€)</label><input id="savedInput" type="number">
<button onclick="saveGoal()">Salvar</button></div></section>

<div class="tabs">
<button onclick="show('home')">🏠 Início</button><button onclick="show('add')">➕ Gasto</button>
<button onclick="show('goals')">🎯 Meta</button><button onclick="show('settings')">⚙️ Ajustes</button>
</div>
</main>
<script>
let d=JSON.parse(localStorage.getItem('meuDinheiroApp')||'null')||{
income:600,baby:150,loan:100,fuel:50,food:50,other:0,save:250,goal:5000,saved:0,expenses:[]
};
const euro=n=>new Intl.NumberFormat('pt-IE',{style:'currency',currency:'EUR'}).format(n||0);
function render(){
income.textContent=euro(d.income);saving.textContent=euro(d.save);saved.textContent=euro(d.saved);
let extras=d.expenses.reduce((s,x)=>s+x.value,0);
let freeMoney=d.income-d.baby-d.loan-d.fuel-d.food-d.other-d.save-extras;
free.textContent=euro(freeMoney);
let pct=Math.min(100,d.saved/d.goal*100);bar.style.width=pct+'%';
goalText.textContent=euro(d.saved)+' de '+euro(d.goal)+' • '+Math.round(pct)+'%';
let fixed=[['Babá',d.baby],['Loan',d.loan],['Gasolina',d.fuel],['Mercado',d.food],['Outras',d.other]];
expensesList.innerHTML=fixed.map(x=>`<div class="row"><span>${x[0]}</span><b>${euro(x[1])}</b></div>`).join('');
history.innerHTML=d.expenses.map((x,i)=>`<div class="row"><span>${x.description}<br><small>${x.category}</small></span><b>${euro(x.value)} <button onclick="removeExpense(${i})" style="width:auto;padding:5px 8px;margin:0;background:#d9534f">×</button></b></div>`).join('');
form.innerHTML=[['income','Renda'],['baby','Babá'],['loan','Loan'],['fuel','Gasolina'],['food','Mercado'],['other','Outras despesas'],['save','Guardar por semana']].map(x=>`<label>${x[1]} (€)</label><input id="f_${x[0]}" type="number" value="${d[x[0]]}">`).join('');
goalInput.value=d.goal;savedInput.value=d.saved;
}
function store(){localStorage.setItem('meuDinheiroApp',JSON.stringify(d));render()}
function addExpense(){let value=+amount.value;if(!value)return;d.expenses.push({value,description:description.value||'Gasto',category:category.value});amount.value='';description.value='';store()}
function removeExpense(i){d.expenses.splice(i,1);store()}
function save(){['income','baby','loan','fuel','food','other','save'].forEach(k=>d[k]=+document.getElementById('f_'+k).value||0);store();show('home')}
function saveGoal(){d.goal=+goalInput.value||5000;d.saved=+savedInput.value||0;store();show('goals')}
function show(id){['home','add','settings','goals'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');render()}
render();
</script>
</body></html>
